name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dependencies must never run install scripts here: the lockfile is the
      # ground truth, and nothing in the runtime tree needs a build step.
      - run: npm ci --ignore-scripts

      - run: npm run check
      # Includes ACP conformance: every test's traffic is checked against the
      # ACP v1 schema and protocol rules (test/conformance/).
      - run: npm test
      - run: npm run check:package

  # src/pi/rpc-types.ts is a hand-written mirror of pi's RPC protocol. Compare
  # it with the types of the pi release pinned in test/pi-protocol/. That
  # package has its own lockfile so pi's dependency tree stays out of the
  # adapter's (installing from git installs devDependencies); nothing from it
  # runs, since tsc only reads its declaration files.
  pi-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            test/pi-protocol/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix test/pi-protocol
      - run: npm run check:pi-protocol

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      # Runtime dependencies are what ships to users, so those must be clean.
      - run: npm audit --omit=dev
      - run: npm audit signatures --omit=dev

      # Dev advisories are reported but do not fail the build: they cannot reach
      # a user of the published package.
      - run: npm audit || true
